name: rust

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - name: Format
        run: nix develop --accept-flake-config -c just format
      - name: Lint
        run: nix develop --accept-flake-config -c just lint
      - name: Test
        run: nix develop --accept-flake-config -c just test
