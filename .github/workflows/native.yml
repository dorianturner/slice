name: native

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
      - name: Build and test native fixtures
        run: nix develop --accept-flake-config -c just test-native
      - name: Execute the offline viewer smoke test
        run: nix develop --accept-flake-config -c just test-viewer
