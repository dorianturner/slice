[workspace]
members = [
  "crates/slice-core",
  "crates/slice-collector",
  "crates/slice-ebpf",
  "crates/slice-render",
  "crates/slice-cli",
]
default-members = ["crates/slice-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.100"
assert_cmd = "2.0.16"
clap = { version = "4.5.51", features = ["derive"] }
cpp_demangle = "0.5.0"
object = { version = "0.37.3", features = ["read_core", "elf"] }
predicates = "3.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
zstd = "0.13.3"

[workspace.lints.rust]
# The eBPF transport crate contains a small, audited FFI boundary for
# perf_event_open/libbpf. Other crates remain safe by convention.
unsafe_code = "warn"
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
